<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PillsTracker</title>
    <base href="/" />
    <!--<base href="/pills-tracker/" />-->
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PillsTracker.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>

    <script>
        function scheduleNotification(title, body, timestamp) {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'schedule-notification',
                    payload: {
                        title: title,
                        body: body,
                        //timestamp: timestamp
                    }
                });
            } else {
                console.warn("Service Worker не активен");
            }
        }

        async function requestNotificationPermission() {
            if (!("Notification" in window)) {
                console.error("Браузер не поддерживает уведомления");
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                console.log("Разрешение получено");
            } else {
                console.warn("Разрешение не получено:", permission);
            }
        }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
